apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: hsds
  name: hsds
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hsds
  template:
    metadata:
      labels:
        app: hsds
      annotations:
        # scrapes the sn container; add a PodMonitor targeting the sn and dn
        # ports to also collect dn metrics (see docs/prometheus_metrics.md)
        prometheus.io/scrape: "true"
        prometheus.io/port: "5101"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: sn
          image: hdfgroup/hsds:0.7.0
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: data
              mountPath: "/data"
            - name: accounts
              mountPath: "/config/passwd.txt"
              subPath: passwd.txt
            - name: config
              mountPath: "/config/config.yml"
              subPath: config.yml
            - name: override
              mountPath: "/config/override.yml"
              subPath: override.yml
          ports:
            - containerPort: 5101
              name: sn
          env:
            - name: NODE_TYPE
              value: sn
            - name: HEAD_PORT
              value: "0" # no head container
          # asserts node_state, not merely that the process answers: /info is in
          # INFO_METHODS (hsds_logger.request) and bypasses the node_state gate, so an
          # httpGet against it returns 200 even while the node is wedged in WAITING and
          # 503-ing every real request. hsds-node-state takes its port from NODE_TYPE.
          livenessProbe:
            exec:
              command: ["hsds-node-state"]
            initialDelaySeconds: 30
            periodSeconds: 60
            failureThreshold: 5
          readinessProbe:
            exec:
              command: ["hsds-node-state"]
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
        - name: dn
          image: hdfgroup/hsds:0.7.0
          imagePullPolicy: IfNotPresent
          lifecycle:
            preStop:
              exec:
                command: ["/sbin/killall5", "-15"]
          volumeMounts:
            - name: data
              mountPath: "/data"
            - name: config
              mountPath: "/config/config.yml"
              subPath: config.yml
            - name: override
              mountPath: "/config/override.yml"
              subPath: override.yml
          ports:
            - containerPort: 6101
              name: dn
          env:
            - name: NODE_TYPE
              value: dn
            - name: HEAD_PORT
              value: "0" # no head container
          # asserts node_state, not merely that the process answers: /info is in
          # INFO_METHODS (hsds_logger.request) and bypasses the node_state gate, so an
          # httpGet against it returns 200 even while the node is wedged in WAITING and
          # 503-ing every real request. hsds-node-state takes its port from NODE_TYPE.
          livenessProbe:
            exec:
              command: ["hsds-node-state"]
            initialDelaySeconds: 30
            periodSeconds: 60
            failureThreshold: 5
          readinessProbe:
            exec:
              command: ["hsds-node-state"]
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: data
          hostPath:
            # change to directory location for bucket parent directory
            path: /var/mybuckets
            type: Directory
        - name: accounts
          secret:
            secretName: user-password
        - name: config
          configMap:
            name: hsds-config
        - name: override
          configMap:
            name: hsds-override
