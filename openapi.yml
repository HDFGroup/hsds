        - name: include_attrs
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Datatype JSON.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DatatypeObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /datatypes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
      - $ref: '#/components/parameters/DomainParam'
      - $ref: '#/components/parameters/DomainHeader'
      - $ref: '#/components/parameters/BucketParam'
    get:
      operationId: GetDatatype
      tags: [Datatypes]
      summary: Get a committed datatype
      description: A datatype can also be located by path via `h5path`/`grpid` instead of a path id (route `GET /datatypes/`).
      parameters:
        - name: h5path
          in: query
          schema: { type: string }
        - name: grpid
          in: query
          schema: { type: string }
          description: Parent group id used as the base for `h5path` resolution.
        - name: getalias
          in: query
          schema: { type: boolean, default: false }
        - name: include_attrs
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Datatype JSON.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DatatypeObject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
