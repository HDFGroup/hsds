name: h5pyd integration

# Combined HSDS + h5pyd test, kept apart from the HSDS-only suite because a
# failure here can be a real h5pyd bug rather than an HSDS one - and while
# it shared a workflow with the HSDS jobs, a red h5pyd run made HSDS itself
# look broken.

on:
  push:
  pull_request:
    branches: [master]

env:
  ROOT_DIR: ${{github.workspace}}/data

jobs:
  h5pyd-integration:
    # Combined HSDS + h5pyd test. Unlike build-and-test, a failure here can be
    # a real h5pyd bug (not just HSDS), so it's kept as its own job/check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start HSDS and run its tests
        uses: ./.github/actions/run-hsds
        with:
          build-method: docker
          os: ubuntu-latest

      - name: Checkout h5pyd
        uses: actions/checkout@v4
        with:
          repository: HDFGroup/h5pyd
          path: ${{github.workspace}}/h5pyd

      - name: Install h5pyd
        working-directory: ${{github.workspace}}/h5pyd
        run: |
          pip install . -v

      - name: Create h5pyd test folder
        working-directory: ${{github.workspace}}/h5pyd
        env:
          HS_USERNAME: test_user1
          HS_PASSWORD: test
          TEST2_USERNAME: test_user1
          TEST2_PASSWORD: test
          H5PYD_TEST_FOLDER: /home/test_user1/h5pyd_tests/
          HS_ENDPOINT: http://127.0.0.1:5101
        run: |
          hstouch -e $HS_ENDPOINT /home/test_user1/h5pyd_tests/

      - name: Run h5pyd tests
        working-directory: ${{github.workspace}}/h5pyd
        env:
          HS_USERNAME: test_user1
          HS_PASSWORD: test
          TEST2_USERNAME: test_user1
          TEST2_PASSWORD: test
          H5PYD_TEST_FOLDER: /home/test_user1/h5pyd_tests/
          HS_ENDPOINT: http://127.0.0.1:5101
        run: |
          python testall.py

      - name: Shut down Docker
        if: always()
        run: |
          ./stopall.sh

  test-data-setup:
    # Loads the sample test data described in docs/post_install.md
    # ("Test Data Setup") so integration tests that depend on it actually
    # exercise their assertions instead of skipping with
    # "WARNING: Failed to get domain: ... Is test data setup?"
    needs: h5pyd-integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start HSDS
        uses: ./.github/actions/run-hsds
        with:
          build-method: docker
          os: ubuntu-latest
          # this job runs the suite itself further down, against the loaded
          # test data - running it here too would run it twice, and the first
          # pass would be against a server with no test data
          run-tests: "false"

      - name: Checkout h5pyd
        uses: actions/checkout@v4
        with:
          repository: HDFGroup/h5pyd
          path: ${{github.workspace}}/h5pyd

      - name: Install h5pyd
        working-directory: ${{github.workspace}}/h5pyd
        run: |
          pip install . -v

      - name: Create home folders
        # hstouch/hsload below need /home/<user>/ to already exist. That is
        # created by setup_test, which testall.py runs first - so this job used
        # to get it as a side effect of the suite run that has now been turned
        # off. Do it explicitly instead.
        env:
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: admin
          USER_NAME: test_user1
          USER_PASSWORD: test
          USER2_NAME: test_user2
          USER2_PASSWORD: test
          BUCKET_NAME: hsdstest
        run: |
          python tests/integ/setup_test.py

      - name: Load test data
        env:
          HS_USERNAME: test_user1
          HS_PASSWORD: test
          HS_ENDPOINT: http://127.0.0.1:5101
        run: |
          hstouch -e $HS_ENDPOINT /home/test_user1/test/
          wget https://s3.amazonaws.com/hdfgroup/data/hdf5test/tall.h5
          hsload -v -e $HS_ENDPOINT tall.h5 /home/test_user1/test/
          hsls -r -e $HS_ENDPOINT /home/test_user1/test/tall.h5
          # domain_test's testGetDomain, testGetDomainVerbose and
          # testGetDomainsVerbose assert the test-data domain is more than ten
          # seconds old ("created < now - 10"). That holds for the setup those
          # tests were written against - docs/post_install.md, where hsload is
          # run once into a long-lived server - but not here, where the domain
          # is created seconds earlier. Wait it out rather than weaken an
          # assertion that is correct in its intended setting.
          sleep 11

      - name: Run HSDS integration tests (with test data loaded)
        env:
          ADMIN_PASSWORD: admin
          ADMIN_USERNAME: admin
          USER_NAME: test_user1
          USER_PASSWORD: test
          USER2_NAME: test_user2
          USER2_PASSWORD: test
          BUCKET_NAME: hsdstest
          LOG_LEVEL: DEBUG
        run: |
          python testall.py --skip_unit

      - name: Shut down Docker
        if: always()
        run: |
          ./stopall.sh

