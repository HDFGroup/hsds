name: Release

# Cuts a release from a pushed tag: builds the distributions, attaches them to
# a GitHub release whose notes are generated from the commits/PRs since the
# previous release, and uploads them to PyPI (https://pypi.org/project/hsds/).
#
# Docker images are built separately by docker-image.yml, which already
# triggers on the same `v*` tags.
#
# To cut a release:
#   1. Bump the version in pyproject.toml (the SSOT) AND the matching
#      HSDS_VERSION in hsds/basenode.py - the `version` job fails if the two
#      disagree, since basenode's copy is what /about reports to clients.
#   2. git tag -a v0.9.5 -m "v0.9.5" && git push origin v0.9.5
#
# `workflow_dispatch` runs the validation half only (publishes nothing), so
# the version/tag checks can be rehearsed off a branch before tagging.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate only - publish nothing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Single place to change if the release pipeline moves to a newer Python.
  # Needs >= 3.11 for tomllib in release_version.py.
  BUILD_PYTHON_VERSION: "3.12"

jobs:
  # ---------------------------------------------------------------------
  # Resolve and validate the version before anything is published, so a tag
  # that disagrees with the source tree fails fast rather than producing a
  # release that misstates its own version.
  # ---------------------------------------------------------------------
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ssot.outputs.version }}
      tag: ${{ steps.ssot.outputs.tag }}
      prerelease: ${{ steps.ssot.outputs.prerelease }}
      dry_run: ${{ steps.mode.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.BUILD_PYTHON_VERSION }}

      - name: Determine run mode
        id: mode
        run: echo "dry_run=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"

      - name: Read version from SSOT and validate against tag
        id: ssot
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: python .github/scripts/release_version.py

      - name: Summary
        run: |
          {
            echo "### Release ${{ steps.ssot.outputs.tag }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`${{ steps.ssot.outputs.version }}\` |"
            echo "| Tag | \`${{ steps.ssot.outputs.tag }}\` |"
            echo "| Pre-release | \`${{ steps.ssot.outputs.prerelease }}\` |"
            echo "| Dry run | \`${{ steps.mode.outputs.dry_run }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------
  # Build once. The same sdist/wheel are attached to the GitHub release and
  # uploaded to PyPI - never rebuilt per target, so the two can't disagree.
  # This job runs on a dry run too, so `workflow_dispatch` rehearses the build
  # and metadata checks rather than only the version validation.
  # ---------------------------------------------------------------------
  build:
    name: Build distributions
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.BUILD_PYTHON_VERSION }}

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check metadata
        run: python -m twine check --strict dist/*

      - name: Verify built version matches the tag
        env:
          EXPECTED: ${{ needs.version.outputs.version }}
        run: |
          # Guards against a stale build backend or leftover dist/ contents
          # silently shipping the wrong version.
          if ! ls "dist/hsds-${EXPECTED}.tar.gz" >/dev/null 2>&1; then
            echo "::error::expected dist/hsds-${EXPECTED}.tar.gz, got:"
            ls -1 dist/
            exit 1
          fi

      - name: Smoke test the wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/python -c "import hsds; print('import ok')"
          /tmp/smoke/bin/hsds --help > /dev/null
          # Only `hsds` itself is safe to run: hsds-datanode, hsds-servicenode
          # and hsds-headnode start serving instead of printing help and never
          # return. Resolve the rest of the entry points without calling them.
          /tmp/smoke/bin/python - <<'PY'
          from importlib.metadata import entry_points

          eps = [e for e in entry_points(group="console_scripts")
                 if e.module.startswith("hsds")]
          assert eps, "no hsds console scripts in the installed metadata"
          for ep in sorted(eps, key=lambda e: e.name):
              ep.load()  # imports the module, resolves the attr, does not call
              print(f"entry point ok: {ep.name} -> {ep.value}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # Create the tag. Derived from the SSOT rather than typed by hand, so it
  # cannot disagree with pyproject.toml.
  #
  # Placed after build and before github-release, keeping the pipeline
  # ordered by how hard each step is to undo: validate and build create
  # nothing, a tag and a release can be deleted, a PyPI upload cannot. A
  # failed build therefore never leaves a stray tag behind.
  # ---------------------------------------------------------------------
  tag:
    name: Tag
    needs: [version, build]
    if: needs.version.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create and push the tag
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          # An annotated tag's refs/tags/<t> is the tag object, not the
          # commit, so ask for the peeled ref first and fall back for
          # lightweight tags.
          existing=$(git ls-remote origin "refs/tags/${TAG}^{}" | cut -f1)
          if [ -z "$existing" ]; then
            existing=$(git ls-remote origin "refs/tags/${TAG}" | cut -f1)
          fi

          if [ -n "$existing" ]; then
            # Re-running after a later job failed is expected and fine, as
            # long as the tag still means the same commit.
            if [ "$existing" = "$GITHUB_SHA" ]; then
              echo "::notice::$TAG already points at $GITHUB_SHA - nothing to do"
              exit 0
            fi
            echo "::error::$TAG already exists at $existing, which is not the"
            echo "commit being released ($GITHUB_SHA). Delete the tag, or bump"
            echo "the version in pyproject.toml and run again."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

  # ---------------------------------------------------------------------
  # GitHub release. Notes come from --generate-notes (commits/PRs since the
  # previous release) rather than a hand-maintained CHANGELOG, which HSDS
  # does not have. The built dists are attached alongside.
  # ---------------------------------------------------------------------
  github-release:
    name: GitHub release
    needs: [version, build, tag]
    if: needs.version.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          args=(--title "$TAG" --verify-tag --generate-notes)
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "${args[@]}" dist/*

  # ---------------------------------------------------------------------
  # PyPI. Uses Trusted Publishing (OIDC) - no long-lived API token in repo
  # secrets. Requires a one-time publisher config on PyPI plus a `pypi`
  # environment on this repo; both are spelled out in the Publish step below.
  #
  # Runs after github-release rather than alongside it. The two publish to
  # places with very different undo stories: a GitHub release can be deleted
  # and recreated, while PyPI permanently burns a version number - a deleted
  # release cannot be re-uploaded. Ordering it this way means a failure in the
  # recoverable half stops the irreversible half from happening at all.
  # ---------------------------------------------------------------------
  pypi:
    name: Publish to PyPI
    needs: [version, github-release]
    if: needs.version.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/hsds/${{ needs.version.outputs.version }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        # Trusted Publishing is configured at
        # https://pypi.org/manage/project/hsds/settings/publishing/
        #   owner: HDFGroup   repo: hsds
        #   workflow: release.yml   environment: pypi
        #
        # To use an API token instead, drop the `id-token: write` permission
        # above and add:
        #   with:
        #     password: ${{ secrets.PYPI_API_TOKEN }}
