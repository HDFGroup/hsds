name: Release

# Cuts a release when dispatched by hand from master: reads the version from
# pyproject.toml, builds the distributions, creates the `v<version>` tag,
# attaches the distributions to a GitHub release whose notes come from
# CHANGELOG.md, and uploads them to PyPI (https://pypi.org/project/hsds/).
#
# A dry run (the default) builds and validates without publishing anything,
# and can be run from any branch. A real release runs only from master.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate only - publish nothing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Single place to change if the release pipeline moves to a newer Python.
  # Needs >= 3.11 for tomllib in release_version.py.
  BUILD_PYTHON_VERSION: "3.12"

jobs:
  # ---------------------------------------------------------------------
  # Resolve and validate the version before anything is published, so a
  # version that is malformed or disagrees with HSDS_VERSION fails fast rather
  # than producing a release that misstates its own version.
  # ---------------------------------------------------------------------
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ssot.outputs.version }}
      tag: ${{ steps.ssot.outputs.tag }}
      prerelease: ${{ steps.ssot.outputs.prerelease }}
      dry_run: ${{ steps.mode.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.BUILD_PYTHON_VERSION }}

      - name: Determine run mode
        id: mode
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: echo "dry_run=${DRY_RUN}" >> "$GITHUB_OUTPUT"

      # Every later job needs this one, so failing here stops the whole run.
      - name: Require master for a real release
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          REF: ${{ github.ref }}
        run: |
          if [ "$DRY_RUN" != "true" ] && [ "$REF" != "refs/heads/master" ]; then
            echo "::error::releases run only from master (this run is on ${REF}); use a dry run to test a branch"
            exit 1
          fi

      - name: Read and validate version from SSOT
        id: ssot
        run: python .github/scripts/release_version.py

      # Fails here rather than in github-release, so a changelog that does not
      # describe the version being cut stops the run before anything is built,
      # tagged or published.
      - name: Check CHANGELOG.md against the version
        env:
          VERSION: ${{ steps.ssot.outputs.version }}
        run: |
          python .github/scripts/changelog_notes.py \
            --version "$VERSION" --output /dev/null

      - name: Summary
        env:
          VERSION: ${{ steps.ssot.outputs.version }}
          TAG: ${{ steps.ssot.outputs.tag }}
          PRERELEASE: ${{ steps.ssot.outputs.prerelease }}
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
        run: |
          {
            echo "### Release ${TAG}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`${VERSION}\` |"
            echo "| Tag | \`${TAG}\` |"
            echo "| Pre-release | \`${PRERELEASE}\` |"
            echo "| Dry run | \`${DRY_RUN}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------
  # Build once. The same sdist/wheel are attached to the GitHub release and
  # uploaded to PyPI - never rebuilt per target, so the two can't disagree.
  # This job runs on a dry run too, so `workflow_dispatch` rehearses the build
  # and metadata checks rather than only the version validation.
  # ---------------------------------------------------------------------
  build:
    name: Build distributions
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.BUILD_PYTHON_VERSION }}

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check metadata
        run: python -m twine check --strict dist/*

      - name: Verify built version matches the tag
        env:
          EXPECTED: ${{ needs.version.outputs.version }}
        run: |
          # Guards against a stale build backend or leftover dist/ contents
          # silently shipping the wrong version.
          if ! ls "dist/hsds-${EXPECTED}.tar.gz" >/dev/null 2>&1; then
            echo "::error::expected dist/hsds-${EXPECTED}.tar.gz, got:"
            ls -1 dist/
            exit 1
          fi

      - name: Smoke test the wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/python -c "import hsds; print('import ok')"
          /tmp/smoke/bin/hsds --help > /dev/null
          # Only `hsds` itself is safe to run: hsds-datanode, hsds-servicenode
          # and hsds-headnode start serving instead of printing help and never
          # return. Resolve the rest of the entry points without calling them.
          /tmp/smoke/bin/python - <<'PY'
          from importlib.metadata import entry_points

          eps = [e for e in entry_points(group="console_scripts")
                 if e.module.startswith("hsds")]
          assert eps, "no hsds console scripts in the installed metadata"
          for ep in sorted(eps, key=lambda e: e.name):
              ep.load()  # imports the module, resolves the attr, does not call
              print(f"entry point ok: {ep.name} -> {ep.value}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # Create the tag.
  #
  # Placed after build and before github-release, keeping the pipeline
  # ordered by how hard each step is to undo.
  # ---------------------------------------------------------------------
  tag:
    name: Tag
    needs: [version, build]
    if: needs.version.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create and push the tag
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          # An annotated tag's refs/tags/<t> is the tag object, not the
          # commit, so ask for the peeled ref first and fall back for
          # lightweight tags.
          existing=$(git ls-remote origin "refs/tags/${TAG}^{}" | cut -f1)
          if [ -z "$existing" ]; then
            existing=$(git ls-remote origin "refs/tags/${TAG}" | cut -f1)
          fi

          if [ -n "$existing" ]; then
            # Re-running after a later job failed is expected and fine, as
            # long as the tag still means the same commit.
            if [ "$existing" = "$GITHUB_SHA" ]; then
              echo "::notice::$TAG already points at $GITHUB_SHA - nothing to do"
              exit 0
            fi
            echo "::error::$TAG already exists at $existing, which is not the"
            echo "commit being released ($GITHUB_SHA). Delete the tag, or bump"
            echo "the version in pyproject.toml and run again."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

  # ---------------------------------------------------------------------
  # GitHub release. The notes are CHANGELOG.md's Executive Summary section,
  # with --generate-notes appending the commits/PRs since the previous release
  # underneath it.
  # ---------------------------------------------------------------------
  github-release:
    name: GitHub release
    needs: [version, build, tag]
    if: needs.version.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Build the release body from CHANGELOG.md
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          python .github/scripts/changelog_notes.py \
            --version "$VERSION" \
            --output description.txt
          echo "--- release body ---"
          cat description.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          # --notes-file with --generate-notes keeps both: GitHub prepends the
          # given body to the notes it generates.
          args=(--title "$TAG" --verify-tag --generate-notes
                --notes-file description.txt)
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "${args[@]}" dist/*

  # ---------------------------------------------------------------------
  # PyPI. Uses Trusted Publishing (OIDC)
  # ---------------------------------------------------------------------
  pypi:
    name: Publish to PyPI
    needs: [version, github-release]
    if: needs.version.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/hsds/${{ needs.version.outputs.version }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
