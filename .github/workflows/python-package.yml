# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python package

on:
  push:
  pull_request:
    branches: [master]

env:
  ROOT_DIR: ${{github.workspace}}/data

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
        build-method: ["manual", "docker"]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Lint with flake8
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 . --count --max-complexity=10 --max-line-length=127 --statistics

      - name: Start HSDS and run its tests
        uses: ./.github/actions/run-hsds
        with:
          build-method: ${{ matrix.build-method }}
          os: ${{ matrix.os }}

      - name: Shut down Docker
        if: ${{matrix.build-method == 'docker' && matrix.os != 'windows-latest'}}
        run: |
          ./stopall.sh

  h5pyd-integration:
    # Combined HSDS + h5pyd test. Unlike build-and-test, a failure here can be
    # a real h5pyd bug (not just HSDS), so it's kept as its own job/check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start HSDS and run its tests
        uses: ./.github/actions/run-hsds
        with:
          build-method: docker
          os: ubuntu-latest

      - name: Checkout h5pyd
        uses: actions/checkout@v4
        with:
          repository: HDFGroup/h5pyd
          path: ${{github.workspace}}/h5pyd

      - name: Install h5pyd
        working-directory: ${{github.workspace}}/h5pyd
        run: |
          pip install . -v

      - name: Create h5pyd test folder
        working-directory: ${{github.workspace}}/h5pyd
        env:
          HS_USERNAME: test_user1
          HS_PASSWORD: test
          TEST2_USERNAME: test_user1
          TEST2_PASSWORD: test
          H5PYD_TEST_FOLDER: /home/test_user1/h5pyd_tests/
          HS_ENDPOINT: http://127.0.0.1:5101
        run: |
          hstouch -e $HS_ENDPOINT /home/test_user1/h5pyd_tests/

      - name: Run h5pyd tests
        working-directory: ${{github.workspace}}/h5pyd
        env:
          HS_USERNAME: test_user1
          HS_PASSWORD: test
          TEST2_USERNAME: test_user1
          TEST2_PASSWORD: test
          H5PYD_TEST_FOLDER: /home/test_user1/h5pyd_tests/
          HS_ENDPOINT: http://127.0.0.1:5101
        run: |
          python testall.py

      - name: Shut down Docker
        if: always()
        run: |
          ./stopall.sh

  test-data-setup:
    # Loads the sample test data described in docs/post_install.md
    # ("Test Data Setup") so integration tests that depend on it actually
    # exercise their assertions instead of skipping with
    # "WARNING: Failed to get domain: ... Is test data setup?"
    needs: h5pyd-integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start HSDS
        uses: ./.github/actions/run-hsds
        with:
          build-method: docker
          os: ubuntu-latest

      - name: Checkout h5pyd
        uses: actions/checkout@v4
        with:
          repository: HDFGroup/h5pyd
          path: ${{github.workspace}}/h5pyd

      - name: Install h5pyd
        working-directory: ${{github.workspace}}/h5pyd
        run: |
          pip install . -v

      - name: Load test data
        env:
          HS_USERNAME: test_user1
          HS_PASSWORD: test
          HS_ENDPOINT: http://127.0.0.1:5101
        run: |
          hstouch -e $HS_ENDPOINT /home/test_user1/test/
          wget https://s3.amazonaws.com/hdfgroup/data/hdf5test/tall.h5
          hsload -v -e $HS_ENDPOINT tall.h5 /home/test_user1/test/
          hsls -r -e $HS_ENDPOINT /home/test_user1/test/tall.h5

      - name: Run HSDS integration tests (with test data loaded)
        env:
          ADMIN_PASSWORD: admin
          ADMIN_USERNAME: admin
          USER_NAME: test_user1
          USER_PASSWORD: test
          USER2_NAME: test_user2
          USER2_PASSWORD: test
          BUCKET_NAME: hsdstest
          LOG_LEVEL: DEBUG
        run: |
          python testall.py --skip_unit

      - name: Shut down Docker
        if: always()
        run: |
          ./stopall.sh

  build-and-test-socket:
    env:
      ADMIN_PASSWORD: admin
      ADMIN_USERNAME: admin
      USER_NAME: test_user1
      USER_PASSWORD: test
      USER2_NAME: test_user2
      USER2_PASSWORD: test
      HSDS_ENDPOINT: http+unix://%2Ftmp%2Fhs%2Fsn_1.sock
      ROOT_DIR: ${{github.workspace}}/hsdsdata
      BUCKET_NAME: hsdstest

    name: Test HSDS with socket
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12"]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install HSDS dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install HSDS package
        shell: bash
        run: |
          pip install -e .

      # Requests 2.32.0 breaks requests-unixsocket, used by HSDS for socket connections
      # - name: Fix requests version
      #  run: |
      #    pip install requests==2.31.0

      - name: Run HSDS unit tests
        shell: bash
        run: |
          pytest

      - name: Start HSDS
        run: |
          mkdir ${{github.workspace}}/hsdsdata
          mkdir ${{github.workspace}}/hsdsdata/hsdstest
          cp admin/config/groups.default admin/config/groups.txt
          cp admin/config/passwd.default admin/config/passwd.txt
          ROOT_DIR=${{github.workspace}}/hsdsdata ./runall.sh --no-docker 1 &
          sleep 10

      - name: Test HSDS setup
        run: |
          python tests/integ/setup_test.py

      - name: Test HSDS
        run : |
          python testall.py